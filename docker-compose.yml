services:
  app:
    build: ./app
    env_file:
      - ./app/.env
      - ./.env
    volumes:
      - ./app/src:/app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      RABBITMQ_HOST: rabbitmq

  web-proxy:
    build: ./web-proxy
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    restart: on-failure

  database:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: on-failure

  telegram-bot:
    image: ml-service-telegram-bot:latest
    build: 
      context: ./telegram_bot
    env_file:
      - ./telegram_bot/.env
    environment:
      API_BASE_URL: http://web-proxy
    depends_on:
      app:
        condition: service_healthy
      web-proxy:
        condition: service_started
    restart: unless-stopped

  worker-1:
    build:
      context: ./app
    command: python -u -m workers.worker
    env_file:
      - ./app/.env
      - ./.env
    environment:
      DB_HOST: database
      RABBITMQ_HOST: rabbitmq
      WORKER_ID: worker-1
    volumes:
      - ./app/src:/app/src
    depends_on:
      - database
      - rabbitmq
    restart: on-failure

  worker-2:
    build:
      context: ./app
    command: python -u -m workers.worker
    env_file:
      - ./app/.env
      - ./.env
    environment:
      DB_HOST: database
      RABBITMQ_HOST: rabbitmq
      WORKER_ID: worker-2
    volumes:
      - ./app/src:/app/src
    depends_on:
      - database
      - rabbitmq
    restart: on-failure